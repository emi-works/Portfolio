<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>EMI HASEGAWA | Portfolio</title>
  <meta name="description" content="業務効率化からWebサイト、アプリ、動画編集まで、ITの力であなたのアイデアを具現化します。">

  <!-- OGP（SNS・LINE で共有されたときの表示）。画像は絶対URLで書く -->
  <meta property="og:title" content="EMI HASEGAWA | Portfolio">
  <meta property="og:description" content="業務効率化からWebサイト、アプリ、動画編集まで、ITの力であなたのアイデアを具現化します。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://emi-works.github.io/Portfolio/">
  <meta property="og:image" content="https://emi-works.github.io/Portfolio/ogp.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext x='32' y='50' font-size='56' text-anchor='middle' font-family='serif' fill='%23FF6B00'%3EE%3C/text%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans:wght@400;700&display=swap">
  <link rel="stylesheet" href="style.css">

  <!-- Google tag (gtag.js) -->
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }

    (() => {
      const GA_MEASUREMENT_ID = 'G-TT0E333CEB';
      const EXCLUDE_KEY = 'ga-exclude';

      // ?exclude=1 で自分のブラウザを計測から除外、?exclude=0 で解除
      const params = new URLSearchParams(location.search);
      const excludeParam = params.get('exclude');
      let isExcluded = false;
      try {
        if (excludeParam === '1') localStorage.setItem(EXCLUDE_KEY, '1');
        if (excludeParam === '0') localStorage.removeItem(EXCLUDE_KEY);
        isExcluded = localStorage.getItem(EXCLUDE_KEY) === '1';
      } catch (e) {
        // localStorage が使えない環境（プライベートブラウズ等）では除外しない
      }

      // URL を共有しても除外が広がらないよう、パラメータを消す（config より前に）
      if (excludeParam === '1' || excludeParam === '0') {
        params.delete('exclude');
        const query = params.toString();
        history.replaceState(null, '', location.pathname + (query ? `?${query}` : '') + location.hash);
      }

      if (isExcluded) {
        window[`ga-disable-${GA_MEASUREMENT_ID}`] = true;
        console.log('GA: 計測除外中');
      }

      const tag = document.createElement('script');
      tag.async = true;
      tag.src = `https://www.googletagmanager.com/gtag/js?id=${GA_MEASUREMENT_ID}`;
      document.head.appendChild(tag);

      gtag('js', new Date());
      gtag('config', GA_MEASUREMENT_ID);
    })();
  </script>
</head>
<body>
  <!-- 背景（紙の質感・セクション名の大きな文字・図形）。動きは background.js -->
  <div class="bg-layer" id="bg-grain"></div>
  <div class="bg-layer" id="bg-word"></div>
  <div class="bg-layer" id="bg-shapes"><svg></svg></div>

  <div id="section-label"></div>

  <!-- どのセクションからでも CONTACT へ移動するボタン -->
  <button id="contact-cta" type="button" aria-label="お問い合わせへ移動">CONTACT<svg class="cta-arrow" viewBox="0 0 16 10" aria-hidden="true"><path d="M0 5 H14 M10 1 L14 5 L10 9"/></svg></button>

  <nav id="nav" aria-label="セクション">
    <ul></ul>
    <span class="nav-marker"></span>
  </nav>

  <!-- 中身は script.js で生成 -->
  <main id="app"></main>

  <div id="modal" hidden></div>

  <script src="content.js"></script>
  <script src="background.js"></script>
  <script src="script.js"></script>
</body>
</html>
